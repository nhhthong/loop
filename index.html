<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LOOP</title>
  <link rel="stylesheet" href="/src/ui/style.css" />
</head>
<body>
  <canvas id="game"></canvas>
  <div id="eyelids"><div class="lid top"></div><div class="lid bottom"></div></div>
  <div id="hud">
    <div id="crosshair"></div>
    <div id="prompt"></div>
    <div id="hint"></div>
  </div>
  <div id="menu">
    <h1>LOOP</h1>
    <div id="loading"><div id="bar"><span></span></div><p id="loadtext">Loading…</p></div>
    <button id="start" disabled>Start</button>
    <div id="quality">Graphics:
      <button data-q="low">Low</button><button data-q="medium">Medium</button><button data-q="high">High</button>
    </div>
    <p class="tip">Headphones recommended · WASD move · Mouse look · E interact · Shift run · C crouch</p>
    <a id="credits-link" href="#">Credits</a>
  </div>
  <div id="pause" class="hidden"><p>Paused — click to resume</p></div>
  <div id="credits" class="hidden"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
