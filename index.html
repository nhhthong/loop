<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LOOP</title>
  <link rel="stylesheet" href="/src/ui/style.css" />
</head>
<body>
  <canvas id="game"></canvas>
  <div id="eyelids"><div class="lid top"></div><div class="lid bottom"></div></div>
  <div id="hud">
    <div id="crosshair"></div>
    <div id="prompt"></div>
    <div id="hint"></div>
  </div>
  <div id="menu">
    <div id="menu-veil"></div>
    <div id="menu-panel">
      <h1>LOOP</h1>
      <div id="loading"><div id="bar"><span></span></div><p id="loadtext">Loading…</p></div>
      <nav id="menu-items">
        <button id="start" class="item" disabled>Start</button>
        <div id="quality" class="item row"><span>Graphics</span><button data-q="low">Low</button><button data-q="medium">Medium</button><button data-q="high">High</button></div>
        <a id="credits-link" class="item" href="#">Credits</a>
      </nav>
    </div>
    <p class="tip">Headphones recommended<br><span class="desk">WASD move · Mouse look · E interact · Shift run · C crouch</span><span class="mob">Left stick move · Drag to look · E interact</span></p>
  </div>
  <div id="pause" class="hidden"><p><span class="desk">Paused — click to resume</span><span class="mob">Paused — tap to resume</span></p></div>
  <div id="rotate"><p>Rotate your device</p></div>
  <div id="credits" class="hidden"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
